name: '${name}'
version: '${version}'
main: '${main}'

authors:
  - Drak

api-version: 1.13
folia-supported: true

depend:
  - BukkitOfUtils

softdepend:
  - PlaceholderAPI
  - Nexo
  - ItemsAdder
  - MythicMobs
  - MythicItems

commands:
  networks:
    description: Manage your Restored networks
    permission: restored.command.networks
    aliases: [network, rn]
  rrecipes:
    description: View Restored item recipes
    permission: restored.command.rrecipes
    aliases: [rrecipe, restoredrecipes]
  rinfo:
    description: Learn how Restored works
    permission: restored.command.rinfo
    aliases: [restoredinfo, rhelp]
  rgetitem:
    description: Get a Restored custom item
    permission: restored.command.rgetitem
    aliases: [rget, restoredgetitem]
  networkadmin:
    description: Administer every Restored network on the server
    usage: /networkadmin <manage (radius)|adminmode|deletemode>
    permission: restored.command.networkadmin
    aliases: [nadmin, restoredadmin]

permissions:
  restored.command.networkadmin:
    description: Use /networkadmin and its owner-level access to every network
    default: op
