#   - Restored items: network_core, network_chest, network_component, network_upgrade,
#     augment_component, augment_crafting, augment_smelting, ...
#   - Vanilla materials: GLASS, REDSTONE, OAK_PLANKS, etc.
#   - Any wood planks: PLANKS (Tag.PLANKS — all wood/nether plank types)
#   - Soft-dep custom items: itemsadder:namespace:id, nexo:id, mythic:id

